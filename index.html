<!DOCTYPE html>
<html lang="en"><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cell Structure, Membranes & Osmosis Review</title>
<style>
  :root {
    --bg-dark: #0f172a;
    --card-bg: rgba(30, 41, 59, 0.75);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #38bdf8;
    --correct: #22c55e;
    --correct-bg: rgba(34, 197, 94, 0.2);
    --wrong: #ef4444;
    --wrong-bg: rgba(239, 68, 68, 0.2);
  }

  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  /* Animated background blobs */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    z-index: -1;
    opacity: 0.4;
    animation: float 10s ease-in-out infinite alternate;
  }
  .blob-1 { top: -10%; left: -10%; width: 500px; height: 500px; background: #38bdf8; }
  .blob-2 { bottom: -10%; right: -10%; width: 400px; height: 400px; background: #818cf8; animation-delay: -5s; }

  @keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(50px, 50px) scale(1.1); }
  }

  .game-container {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    padding: 2.5rem;
    width: 90%;
    max-width: 800px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    position: relative;
    text-align: center;
    max-height: 95vh;
    overflow-y: auto;
  }

  .header {
    margin-bottom: 1.5rem;
  }

  h1 {
    margin: 0;
    font-size: 1.8rem;
    background: linear-gradient(to right, #38bdf8, #818cf8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    font-size: 0.9rem;
    color: var(--text-muted);
    margin-top: 0.5rem;
  }

  .progress-bar {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    margin-bottom: 1.5rem;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(to right, #38bdf8, #818cf8);
    width: 0%;
    transition: width 0.4s ease;
  }

  .question-text {
    font-size: 1.15rem;
    margin-bottom: 1.5rem;
    font-weight: 500;
    line-height: 1.4;
  }

  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  .options-grid.single-col {
    grid-template-columns: 1fr;
  }

  .option-btn {
    background: rgba(51, 65, 85, 0.4);
    border: 1px solid rgba(148, 163, 184, 0.2);
    color: var(--text-main);
    padding: 1rem;
    border-radius: 12px;
    font-size: 1.05rem;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    text-align: left;
  }

  .option-btn:hover:not(:disabled) {
    background: rgba(56, 189, 248, 0.15);
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .option-btn:active:not(:disabled) {
    transform: translateY(0);
  }

  .menu-btn {
    background: rgba(56, 189, 248, 0.15);
    border: 1px solid var(--accent);
    color: var(--text-main);
    padding: 1.2rem;
    border-radius: 12px;
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.2s ease;
    width: 100%;
    margin-bottom: 1rem;
    font-weight: bold;
  }
  
  .menu-btn:hover {
    background: rgba(56, 189, 248, 0.3);
    transform: scale(1.02);
  }

  .key-badge {
    background: #0f172a;
    border: 1px solid #475569;
    border-radius: 6px;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-family: monospace;
    font-weight: bold;
    color: var(--text-muted);
    margin-right: 15px;
    flex-shrink: 0;
  }

  .option-btn.correct {
    background: var(--correct-bg);
    border-color: var(--correct);
    color: var(--correct);
    animation: pulseCorrect 0.5s ease;
  }

  .option-btn.wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong);
    color: var(--wrong);
    animation: shakeWrong 0.4s ease;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid rgba(255,255,255,0.1);
    font-size: 0.95rem;
  }

  .stats { color: var(--text-muted); }
  .score-val { color: var(--accent); font-weight: bold; font-size: 1.1rem; }

  .continue-hint {
    background: var(--accent);
    color: var(--bg-dark);
    padding: 0.5rem 1rem;
    border-radius: 8px;
    font-weight: bold;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
  }

  .continue-hint.visible {
    opacity: 1;
    transform: translateY(0);
    animation: pulseHint 2s infinite;
  }

  .fade-in { animation: fadeIn 0.4s ease forwards; }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.98); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes pulseCorrect {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.02); }
  }

  @keyframes shakeWrong {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
    75% { transform: translateX(-5px); }
  }

  @keyframes pulseHint {
    0%, 100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.4); }
    50% { box-shadow: 0 0 0 8px rgba(56, 189, 248, 0); }
  }

  @media (max-width: 600px) {
    .options-grid { grid-template-columns: 1fr; }
  }

  #start-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 2rem;
  }
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="game-container">
  <div class="header">
    <h1>Cell Biology & Membranes</h1>
    <div class="subtitle">Membrane Model, Osmosis Lab & Cell Identification</div>
  </div>

  <div id="start-screen" class="fade-in">
    <p style="margin-bottom: 2rem; font-size: 1.1rem; color: #cbd5e1;">Select your study mode below to begin.</p>
    <button class="menu-btn" onclick="initGame('learn')">📖 Learn Basics (Core Concepts)</button>
    <button class="menu-btn" style="border-color: #818cf8; background: rgba(129, 140, 248, 0.15);" onclick="initGame('full')">🎓 Full Review (All Lab Questions)</button>
  </div>

  <div id="quiz-ui" style="display: none;">
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
    </div>

    <div id="game-area" class="fade-in">
      <div class="question-text" id="question-text">Loading...</div>
      <div class="options-grid single-col" id="options-grid"></div>
    </div>

    <div class="footer">
      <div class="stats">Score: <span class="score-val" id="score">0</span></div>
      <div class="continue-hint" id="continue-hint">Press ENTER to continue</div>
      <div class="stats">Question <span id="q-counter" class="score-val">0/0</span></div>
    </div>
  </div>
</div>

<script>
  const textQuestionsData = [
    // --- BASIC LEARNING QUESTIONS (Core Concepts) ---
    {
      q: "What is a eukaryotic cell?[cite: 3]",
      o: ["A cell that has a nucleus and membrane-bound organelles", "A simple cell with no nucleus", "A cell that is only found in plants", "A cell that lacks DNA"],
      a: 0,
      isBase: true
    },
    {
      q: "What is a prokaryotic cell?[cite: 3]",
      o: ["A cell with no nucleus", "A cell with a distinct nucleus", "An animal cell", "A cell that lacks a cell membrane"],
      a: 0,
      isBase: true
    },
    {
      q: "What three structures do ALL cells have in common?[cite: 3]",
      o: ["Cell membrane, cytoplasm, and DNA", "Nucleus, cell wall, and chloroplasts", "Cell wall, cytoplasm, and DNA", "Cell membrane, nucleus, and cytoplasm"],
      a: 0,
      isBase: true
    },
    {
      q: "What does it mean when a cell membrane is described as 'fluid'?[cite: 1]",
      o: ["It is always in motion", "It is made of pure water", "It dissolves easily", "It is entirely rigid"],
      a: 0,
      isBase: true
    },
    {
      q: "What is a 'dependent variable' in an experiment?[cite: 2]",
      o: ["The result or data that is measured (like mass)", "The condition the scientist changes (like the solution)", "The elements kept exactly the same", "The control group"],
      a: 0,
      isBase: true
    },
    {
      q: "What is an 'independent variable' in an experiment?[cite: 2]",
      o: ["The condition the scientist changes (like the liquid concentration)", "The result that is measured (like mass)", "The elements kept exactly the same", "The control group"],
      a: 0,
      isBase: true
    },
    {
      q: "What is a 'controlled variable'?[cite: 2]",
      o: ["A condition kept exactly the same throughout the experiment", "The result being measured", "The main thing being changed by the scientist", "The hypothesis"],
      a: 0,
      isBase: true
    },
    {
      q: "Which type of cell is bacteria?[cite: 3]",
      o: ["Prokaryotic", "Eukaryotic", "Plant cell", "Animal cell"],
      a: 0,
      isBase: true
    },
    {
      q: "Why is having a flexible barrier significant for animal cells?[cite: 1]",
      o: ["So that cells can move with the body", "So they can absorb more light", "So they can become rigid like plants", "So they never divide"],
      a: 0,
      isBase: true
    },
    {
      q: "Based on the cell lab, which structure is found in plant cells (like Onion and Elodea) but NOT in animal cells (like Human cheek and Frog blood)?[cite: 3]",
      o: ["Cell wall", "Cell membrane", "Cytoplasm", "Nucleus"],
      a: 0,
      isBase: true
    },
    {
      q: "If a cell has membrane-bound organelles, it must be classified as:[cite: 3]",
      o: ["Eukaryotic", "Prokaryotic", "Bacterial", "Unicellular only"],
      a: 0,
      isBase: true
    },
    {
      q: "What does the 'self-sealing' nature of a cell membrane allow?[cite: 1]",
      o: ["It allows things to go through without destroying the membrane", "It allows the cell to completely stop all transport", "It makes the cell wall rigid", "It allows the cell to burst safely"],
      a: 0,
      isBase: true
    },
    {
      q: "In the osmosis lab, what liquid was used as the 0% salt concentration control?[cite: 2]",
      o: ["Distilled water", "Tap water", "5% NaCl", "20% NaCl"],
      a: 0,
      isBase: true
    },

    // --- DETAILED LAB QUESTIONS (Full Review Only) ---
    {
      q: "In the bubble activity, what did the light and movement of molecules on the soap film demonstrate?[cite: 1]",
      o: ["Fluidity", "Flexibility", "Self-sealing", "Cell division"],
      a: 0,
      isBase: false
    },
    {
      q: "What specific action in the membrane model lab showed that membranes are 'always in motion'?[cite: 1]",
      o: ["Watching the light on the membrane", "Poking it with a dry paper clip", "Bending the straws", "Dividing the bubble in half"],
      a: 0,
      isBase: false
    },
    {
      q: "What did bending the straws without breaking the soap film demonstrate about membranes?[cite: 1]",
      o: ["Flexibility", "Fluidity", "Permeability", "Rigidity"],
      a: 0,
      isBase: false
    },
    {
      q: "When the membrane sealed around the paper clip, what property did this show?[cite: 1]",
      o: ["Self-sealing", "Fluidity", "Active transport", "Osmosis"],
      a: 0,
      isBase: false
    },
    {
      q: "What happened when the soap bubble membrane was poked with a dry paper clip?[cite: 1]",
      o: ["The membrane popped", "The membrane sealed around it", "The paper clip passed through easily", "The membrane duplicated"],
      a: 0,
      isBase: false
    },
    {
      q: "When poking a finger into the membrane, what property was demonstrated when it didn't pop?[cite: 1]",
      o: ["Self-sealing", "Active transport", "Osmosis", "Cell division"],
      a: 0,
      isBase: false
    },
    {
      q: "In the membrane model lab, what represented an opening for the transport of substances through the membrane?[cite: 1]",
      o: ["A hole opened through the string circle", "The straws bending", "The dry paper clip", "The light reflecting on the soap"],
      a: 0,
      isBase: false
    },
    {
      q: "Dividing the bubble in half without it popping was used to show what cellular process?[cite: 1]",
      o: ["Cell division", "Protein synthesis", "Osmosis", "Cellular respiration"],
      a: 0,
      isBase: false
    },
    {
      q: "Before weighing the carrot/potato in the osmosis lab, what crucial step had to be done?[cite: 2]",
      o: ["Dry it off using a paper towel", "Soak it in distilled water", "Cut it into smaller pieces", "Measure its length"],
      a: 0,
      isBase: false
    },
    {
      q: "What specific salt (NaCl) solution concentrations were tested in the osmosis lab alongside distilled water?[cite: 2]",
      o: ["5% and 20%", "10% and 50%", "1% and 5%", "15% and 30%"],
      a: 0,
      isBase: false
    },
    {
      q: "In the Osmosis Lab, what formula is used to calculate the change in mass?[cite: 2]",
      o: ["Final mass - Initial mass", "Initial mass + Final mass", "Final mass / Initial mass", "Initial mass - Final mass"],
      a: 0,
      isBase: false
    },
    {
      q: "In the Osmosis Lab, what is the correct formula to calculate the percent change in mass?[cite: 2]",
      o: ["(Change in Mass / Initial Mass) x 100", "(Final Mass / Initial Mass) x 100", "(Initial Mass / Change in Mass) x 100", "(Change in Mass / Final Mass) x 100"],
      a: 0,
      isBase: false
    },
    {
      q: "When making the bar graph for the osmosis lab data, which variable goes on the Y axis?[cite: 2]",
      o: ["% Change in mass", "Concentration of solutions", "Initial mass", "Final mass"],
      a: 0,
      isBase: false
    },
    {
      q: "When making the bar graph for the osmosis lab data, which variable goes on the X axis?[cite: 2]",
      o: ["Concentration of the solutions", "% Change in mass", "Type of potato/carrot", "Time in solution"],
      a: 0,
      isBase: false
    },
    {
      q: "Which of these lists contains ONLY controlled variables from the osmosis lab?[cite: 2]",
      o: ["Cup size, storage area, amount of liquid, and temp of room", "Solutions, concentration, mass, and cup size", "Liquid concentration, mass, weight, and storage area", "Mass, weight, change in mass, and % change"],
      a: 0,
      isBase: false
    },
    {
      q: "Which of the following lists contains ONLY eukaryotic cells observed in the lab?[cite: 3]",
      o: ["Human, onion, Elodea, frog, and paramecium", "Bacteria, onion, Elodea, and frog", "Human, bacteria, and paramecium", "Onion, Elodea, and bacteria"],
      a: 0,
      isBase: false
    },
    {
      q: "Which of the eukaryotic cells observed from the lab are classified specifically as plant cells?[cite: 3]",
      o: ["Onion and Elodea", "Human and frog", "Paramecium and bacteria", "Onion and human"],
      a: 0,
      isBase: false
    },
    {
      q: "Which of the eukaryotic cells observed are classified specifically as animal cells?[cite: 3]",
      o: ["Human, frog, and paramecium", "Onion and Elodea", "Bacteria and paramecium", "Human, onion, and frog"],
      a: 0,
      isBase: false
    },
    {
      q: "Which ONE cell observed in the lab had visible chloroplasts under the microscope?[cite: 3]",
      o: ["Elodea", "Onion", "Human cheek cell", "Paramecium"],
      a: 0,
      isBase: false
    },
    {
      q: "Which of the plant cells observed did NOT have visible chloroplasts?[cite: 3]",
      o: ["Onion", "Elodea", "Paramecium", "Frog blood cell"],
      a: 0,
      isBase: false
    },
    {
      q: "Is the single-celled organism Paramecium a prokaryote or a eukaryote, and why?[cite: 3]",
      o: ["Eukaryote, because of the nucleus", "Prokaryote, because it is single-celled", "Eukaryote, because it has chloroplasts", "Prokaryote, because it lacks a cell wall"],
      a: 0,
      isBase: false
    },
    {
      q: "When looking at a human cheek cell under a microscope, what three parts were labeled?[cite: 3]",
      o: ["Cell membrane, nucleus, and cytoplasm", "Cell wall, chloroplast, and nucleus", "Cell membrane, DNA, and flagella", "Cell wall, cytoplasm, and DNA"],
      a: 0,
      isBase: false
    },
    {
      q: "When labeling an onion skin cell, what parts were identified?[cite: 3]",
      o: ["Cell wall, nucleus, and cytoplasm", "Cell membrane, nucleus, and chloroplast", "Cell wall, DNA, and cytoplasm", "Cell membrane, nucleus, and cytoplasm"],
      a: 0,
      isBase: false
    },
    {
      q: "What three structures were labeled on the Elodea cells?[cite: 3]",
      o: ["Cell wall, chloroplast, and cytoplasm", "Cell membrane, nucleus, and cytoplasm", "Cell wall, nucleus, and DNA", "Cell membrane, chloroplast, and DNA"],
      a: 0,
      isBase: false
    },
    {
      q: "What parts were labeled on the Frog blood cells?[cite: 3]",
      o: ["Cell membrane, nucleus, and cytoplasm", "Cell wall, nucleus, and cytoplasm", "Cell membrane, chloroplast, and DNA", "Cell wall, cytoplasm, and DNA"],
      a: 0,
      isBase: false
    },
    {
      q: "In the Cell Lab, what genetic material was specifically labeled in the Bacteria cell?[cite: 3]",
      o: ["DNA", "Nucleus", "Chloroplast", "Chromosomes"],
      a: 0,
      isBase: false
    },
    {
      q: "What two specific parts were labeled on the Bacteria cell in the diagram?[cite: 3]",
      o: ["Cell membrane and DNA", "Cell wall and nucleus", "Cell membrane and nucleus", "Chloroplast and cytoplasm"],
      a: 0,
      isBase: false
    }
  ];

  let gameQueue = [];
  let currentQuestionIndex = 0;
  let score = 0;
  let state = 'menu'; 
  let autoAdvanceTimer = null;

  const startScreen = document.getElementById('start-screen');
  const quizUI = document.getElementById('quiz-ui');
  const questionText = document.getElementById('question-text');
  const optionsGrid = document.getElementById('options-grid');
  const progressFill = document.getElementById('progress-fill');
  const qCounter = document.getElementById('q-counter');
  const scoreDisplay = document.getElementById('score');
  const continueHint = document.getElementById('continue-hint');
  const gameArea = document.getElementById('game-area');

  function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex > 0) {
      randomIndex = Math.floor(Math.random() * currentIndex);
      currentIndex--;
      [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
  }

  function showMenu() {
    state = 'menu';
    startScreen.style.display = 'flex';
    quizUI.style.display = 'none';
  }

  function initGame(mode) {
    startScreen.style.display = 'none';
    quizUI.style.display = 'block';
    
    let pool = [];
    
    // Filter questions based on selected mode
    const filteredQuestions = mode === 'learn' 
      ? textQuestionsData.filter(q => q.isBase === true)
      : textQuestionsData;
    
    filteredQuestions.forEach(item => {
      // Map options to objects tracking their correctness, then shuffle them
      let optionsWithFlags = item.o.map((text, i) => ({ text, isCorrect: i === item.a }));
      optionsWithFlags = shuffle(optionsWithFlags);
      
      pool.push({
        q: item.q,
        options: optionsWithFlags.map(opt => opt.text),
        correctIndex: optionsWithFlags.findIndex(opt => opt.isCorrect)
      });
    });

    gameQueue = shuffle(pool);
    currentQuestionIndex = 0;
    score = 0;
    scoreDisplay.textContent = score;
    loadQuestion();
  }

  function loadQuestion() {
    state = 'playing';
    continueHint.classList.remove('visible');
    
    if (autoAdvanceTimer) clearTimeout(autoAdvanceTimer);

    const q = gameQueue[currentQuestionIndex];
    
    qCounter.textContent = `${currentQuestionIndex + 1}/${gameQueue.length}`;
    progressFill.style.width = `${(currentQuestionIndex / gameQueue.length) * 100}%`;

    gameArea.classList.remove('fade-in');
    void gameArea.offsetWidth; 
    gameArea.classList.add('fade-in');

    questionText.textContent = q.q;

    // Load Options
    optionsGrid.innerHTML = '';
    q.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerHTML = `<div class="key-badge">${i + 1}</div> <div>${opt}</div>`;
      btn.onclick = () => submitAnswer(i);
      optionsGrid.appendChild(btn);
    });
  }

  function submitAnswer(selectedIndex) {
    if (state !== 'playing') return;
    state = 'waiting';

    const q = gameQueue[currentQuestionIndex];
    const buttons = optionsGrid.querySelectorAll('.option-btn');
    
    buttons.forEach(btn => btn.disabled = true);

    if (selectedIndex === q.correctIndex) {
      buttons[selectedIndex].classList.add('correct');
      score++;
      scoreDisplay.textContent = score;
    } else {
      buttons[selectedIndex].classList.add('wrong');
      buttons[q.correctIndex].classList.add('correct');
    }

    continueHint.classList.add('visible');
    autoAdvanceTimer = setTimeout(nextQuestion, 3000);
  }

  function nextQuestion() {
    if (state === 'ended') return;
    if (autoAdvanceTimer) clearTimeout(autoAdvanceTimer);

    currentQuestionIndex++;
    if (currentQuestionIndex < gameQueue.length) {
      loadQuestion();
    } else {
      endGame();
    }
  }

  function endGame() {
    state = 'ended';
    continueHint.classList.remove('visible');
    progressFill.style.width = '100%';
    
    gameArea.classList.remove('fade-in');
    void gameArea.offsetWidth;
    gameArea.classList.add('fade-in');
    
    questionText.innerHTML = `<strong>Review Complete!</strong><br><br>You scored ${score} out of ${gameQueue.length}.`;
    
    optionsGrid.classList.add('single-col');
    optionsGrid.innerHTML = `
      <button class="option-btn" style="justify-content: center; background: rgba(56, 189, 248, 0.15); border-color: #38bdf8;" onclick="showMenu()">
        <div class="key-badge" style="width: auto; padding: 0 10px;">ESC</div>
        <div>Return to Menu</div>
      </button>
    `;
  }

  document.addEventListener('keydown', (e) => {
    if (state === 'playing') {
      const key = parseInt(e.key);
      const q = gameQueue[currentQuestionIndex];
      
      // Number keys for answering
      if (key >= 1 && key <= q.options.length) {
        submitAnswer(key - 1);
      }
    } else if (state === 'waiting' && e.key === 'Enter') {
      nextQuestion();
    } else if (state === 'ended' && (e.key === 'Enter' || e.key === 'Escape')) {
      showMenu();
    } else if (state === 'menu') {
      if (e.key === '1') initGame('learn');
      if (e.key === '2') initGame('full');
    }
  });
</script>

</body></html>
