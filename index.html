<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honors Biology: Master Unit 2 Study Game</title>
    <style>
        :root {
            --primary: #4a90e2;
            --primary-hover: #357abd;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #fff;
            --correct: #2ecc71;
            --incorrect: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        #game-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 750px;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        h1 {
            color: var(--primary);
            margin-top: 0;
            margin-bottom: 5px;
        }

        .keyboard-hint {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 20px;
            font-style: italic;
        }

        #question-counter {
            font-size: 0.9em;
            color: #777;
            margin-bottom: 15px;
            font-weight: bold;
        }

        #question-text {
            font-size: 1.25em;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .reference-img {
            max-width: 100%;
            height: auto;
            max-height: 220px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 20px;
            padding: 10px;
            background-color: white;
            border: 1px solid #ddd;
            display: none; 
        }

        #options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #f9f9f9;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            font-size: 1.05em;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            position: relative;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #e8f0fe;
            border-color: var(--primary);
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-btn.correct {
            background-color: var(--correct);
            color: white;
            border-color: var(--correct);
        }

        .option-btn.incorrect {
            background-color: var(--incorrect);
            color: white;
            border-color: var(--incorrect);
        }

        /* Number badges for the buttons */
        .key-badge {
            display: inline-block;
            background-color: #ddd;
            color: #555;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 0.8em;
            margin-right: 10px;
            font-weight: bold;
        }

        .option-btn.correct .key-badge, .option-btn.incorrect .key-badge {
            background-color: rgba(255, 255, 255, 0.3);
            color: white;
        }

        #next-btn, #restart-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 25px;
            display: none;
            transition: background-color 0.2s ease;
        }

        #next-btn:hover, #restart-btn:hover {
            background-color: var(--primary-hover);
        }

        #score-display {
            font-size: 1.5em;
            font-weight: bold;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>Master Biology Review</h1>
        <div class="keyboard-hint">Pro tip: Use keys 1-4 to answer, and Enter for next!</div>
        
        <div id="quiz-screen">
            <div id="question-counter">Question 1 of X</div>
            <img id="question-image" class="reference-img" src="" alt="Reference Image">
            <div id="question-text">Question goes here?</div>
            <div id="options-container">
                <!-- Options injected via JavaScript -->
            </div>
            <button id="next-btn">Next Question (Enter)</button>
        </div>

        <div id="result-screen" style="display: none;">
            <h2>Quiz Complete!</h2>
            <div id="score-display">You scored X out of Y</div>
            <p id="feedback-text"></p>
            <button id="restart-btn" style="display: inline-block;">Play Again</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "What is the smallest unit of an element in science?",
                options: ["Compound", "Atom", "Molecule", "Ion"],
                answer: 1
            },
            {
                question: "What type of chemical bond is formed when electrons are SHARED between atoms?",
                options: ["Ionic bond", "Hydrogen bond", "Covalent bond", "Peptide bond"],
                answer: 2
            },
            {
                question: "Why is water considered a polar molecule?",
                options: ["It forms at the poles of the earth", "It has an equal sharing of electrons", "It is extremely cold", "Oxygen has a slight negative charge and hydrogens have a slight positive charge"],
                answer: 3
            },
            {
                question: "What gives Carbon its unique ability to form large, complex, and diverse molecules?",
                options: ["It has 4 valence electrons allowing it to form strong covalent bonds", "It is highly radioactive", "It only forms ionic bonds with oxygen", "It is the most abundant element in the atmosphere"],
                answer: 0
            },
            {
                question: "What process joins monomers together to form a polymer by REMOVING a water molecule?",
                options: ["Hydrolysis", "Dehydration synthesis", "Adhesion", "Activation energy"],
                answer: 1
            },
            {
                question: "Look at the molecular structure above. What monomer is this, and what part of it is highlighted by the 'R' group?",
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/ce/AminoAcidball.svg/500px-AminoAcidball.svg.png",
                options: ["Nucleotide; the R group is the base", "Amino Acid; the R group determines which specific amino acid it is", "Monosaccharide; the R group is a sugar", "Fatty Acid; the R group is a double bond"],
                answer: 1
            },
            {
                question: "This image shows a closed-ring structure made of Carbon, Hydrogen, and Oxygen in a 1:2:1 ratio. What category of molecule is this?",
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/71/Alpha-D-Glucopyranose.svg/500px-Alpha-D-Glucopyranose.svg.png",
                options: ["Carbohydrate (Monosaccharide)", "Lipid (Fatty Acid)", "Protein (Polypeptide)", "Nucleic Acid (DNA)"],
                answer: 0
            },
            {
                question: "Observe the structure shown. It is a long hydrocarbon chain with a double bond (C=C) causing it to bend. What type of molecule is this?",
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/07/Oleic_acid.svg/500px-Oleic_acid.svg.png",
                options: ["Saturated Fat", "Unsaturated Fat", "Nucleotide", "Polysaccharide"],
                answer: 1
            },
            {
                question: "What monomer is pictured above, identifiable by its three distinct parts: a phosphate group, a 5-carbon sugar, and a nitrogenous base?",
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Nucleotide_nucleoside_general.svg/500px-Nucleotide_nucleoside_general.svg.png",
                options: ["Triglyceride", "Amino Acid", "Monosaccharide", "Nucleotide"],
                answer: 3
            },
            {
                question: "If a molecule is made purely of a Glycerol backbone attached to 3 fatty acid chains, what is it?",
                options: ["A Disaccharide", "A Protein", "A Lipid (Triglyceride)", "An Isotope"],
                answer: 2
            },
            {
                question: "What is the primary effect of enzymes on chemical reactions?",
                options: ["They slow down the reaction rate", "They increase the activation energy needed", "They act as catalysts to speed up reactions by lowering activation energy", "They turn products back into reactants"],
                answer: 2
            },
            {
                question: "In an exothermic reaction, what happens to energy?",
                options: ["Energy is absorbed, leaving products with more energy than reactants", "Energy is released, leaving products with less energy than reactants", "Energy is destroyed completely", "Energy remains perfectly equal"],
                answer: 1
            },
            {
                question: "What happens to an enzyme if the temperature or pH gets too high/extreme?",
                options: ["It works much faster", "It denatures (changes shape) and its active site no longer works", "It turns into a lipid", "It becomes a reactant"],
                answer: 1
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let hasAnswered = false; // Prevents multiple keyboard inputs

        const questionCounterEl = document.getElementById('question-counter');
        const questionImageEl = document.getElementById('question-image');
        const questionTextEl = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const scoreDisplay = document.getElementById('score-display');
        const restartBtn = document.getElementById('restart-btn');
        const feedbackText = document.getElementById('feedback-text');

        function loadQuestion() {
            hasAnswered = false;
            nextBtn.style.display = 'none';
            optionsContainer.innerHTML = '';
            
            const currentQ = questions[currentQuestionIndex];
            
            questionCounterEl.innerText = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
            questionTextEl.innerText = currentQ.question;

            if (currentQ.image) {
                questionImageEl.src = currentQ.image;
                questionImageEl.style.display = 'inline-block';
            } else {
                questionImageEl.style.display = 'none';
            }

            currentQ.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.classList.add('option-btn');
                
                // Add the number badge (1, 2, 3, 4)
                button.innerHTML = `<span class="key-badge">${index + 1}</span> ${option}`;
                
                button.onclick = () => selectAnswer(index, button);
                optionsContainer.appendChild(button);
            });
        }

        function selectAnswer(selectedIndex, selectedButton) {
            if (hasAnswered) return; // Prevent clicking multiple times
            hasAnswered = true;

            const currentQ = questions[currentQuestionIndex];
            const allButtons = optionsContainer.querySelectorAll('.option-btn');
            
            allButtons.forEach(btn => btn.disabled = true);

            if (selectedIndex === currentQ.answer) {
                selectedButton.classList.add('correct');
                score++;
            } else {
                selectedButton.classList.add('incorrect');
                allButtons[currentQ.answer].classList.add('correct');
            }

            nextBtn.style.display = 'inline-block';
        }

        nextBtn.addEventListener('click', () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        });

        function showResults() {
            quizScreen.style.display = 'none';
            resultScreen.style.display = 'block';
            scoreDisplay.innerText = `You scored ${score} out of ${questions.length}!`;
            
            const percentage = (score / questions.length) * 100;
            if (percentage >= 90) {
                feedbackText.innerText = "Incredible! You have mastered Unit 2. Good luck on the test!";
            } else if (percentage >= 70) {
                feedbackText.innerText = "Great job! Review your weak spots and you'll be set.";
            } else {
                feedbackText.innerText = "Keep studying! Use this quiz to memorize the core concepts.";
            }
        }

        restartBtn.addEventListener('click', () => {
            currentQuestionIndex = 0;
            score = 0;
            resultScreen.style.display = 'none';
            quizScreen.style.display = 'block';
            loadQuestion();
        });

        // --- KEYBOARD EVENT LISTENER ---
        document.addEventListener('keydown', (event) => {
            // Don't do anything if we are on the results screen
            if (resultScreen.style.display === 'block') return;

            // Handle "Enter" key for next question
            if (event.key === 'Enter' && nextBtn.style.display === 'inline-block') {
                nextBtn.click();
                return;
            }

            // Handle 1, 2, 3, 4 keys for answering
            const keyMap = { '1': 0, '2': 1, '3': 2, '4': 3 };
            if (keyMap.hasOwnProperty(event.key) && !hasAnswered) {
                const answerIndex = keyMap[event.key];
                const allButtons = optionsContainer.querySelectorAll('.option-btn');
                
                // Ensure the button actually exists (e.g., if there are fewer than 4 options)
                if (allButtons[answerIndex]) {
                    selectAnswer(answerIndex, allButtons[answerIndex]);
                }
            }
        });

        // Initialize the first question
        loadQuestion();
    </script>
</body>
</html>
